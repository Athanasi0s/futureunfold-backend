name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Reads tenants.yml and emits the list as a JSON array so the deploy job
  # can fan out with a matrix. yq is preinstalled on ubuntu-latest runners.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tenants: ${{ steps.read.outputs.tenants }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          tenants=$(yq -o=json '.tenants' tenants.yml | jq -c .)
          echo "tenants=$tenants" >> "$GITHUB_OUTPUT"
          echo "Deploy targets: $tenants"

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    # fail-fast: false so one tenant's failure doesn't cancel the others
    strategy:
      fail-fast: false
      matrix:
        tenant: ${{ fromJSON(needs.plan.outputs.tenants) }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy ${{ matrix.tenant }}
        run: flyctl deploy -c fly.${{ matrix.tenant }}.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
