name: Deploy Future Unfold to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "Set the FLY_API_TOKEN Actions secret in this repository."
            exit 1
          fi
      - name: Deploy Future Unfold
        run: flyctl deploy -c fly.future-unfold.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
