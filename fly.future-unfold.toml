app = "festapp-api-future-unfold"
primary_region = "fra"

[build]

[deploy]
  release_command = "alembic upgrade head && python -m app.seed.bootstrap"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
