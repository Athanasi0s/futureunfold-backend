# fly.toml app configuration file generated for festapp-api-future-unfold on 2026-10-01T16:55:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'festapp-api-future-unfold'
primary_region = 'fra'

[build]

[deploy]
  release_command = "sh -c 'alembic upgrade head && python -m app.seed.bootstrap'"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
